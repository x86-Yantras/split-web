<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SplitSplit — free expense splitting</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #E7E2D6;
    font-family: 'Geist', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #1F1B16;
  }
  body {
    background-image:
      radial-gradient(at 20% 10%, rgba(217,119,87,0.10), transparent 50%),
      radial-gradient(at 80% 90%, rgba(94,122,63,0.10), transparent 50%);
    background-attachment: fixed;
  }
  #root {
    width: 100%; min-height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 0;
    box-sizing: border-box;
  }
  /* Reset button defaults */
  button { font: inherit; }
  /* Custom scrollbar for in-frame scroll areas */
  *::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- Currency + Data + Auth -->
<script src="src/currency.js"></script>
<script src="src/data.js"></script>
<script src="src/auth.js"></script>

<!-- Domain + data layer -->
<script src="src/domain.js"></script>
<script src="src/sheets.js"></script>
<script src="src/store.js"></script>

<!-- Starters + UI -->
<script type="text/babel" src="src/ios-frame.jsx"></script>
<script type="text/babel" src="src/tweaks-panel.jsx"></script>
<script type="text/babel" src="src/ui.jsx"></script>

<!-- Screens -->
<script type="text/babel" src="src/screens/SignIn.jsx"></script>
<script type="text/babel" src="src/screens/Home.jsx"></script>
<script type="text/babel" src="src/screens/Group.jsx"></script>
<script type="text/babel" src="src/screens/AddExpense.jsx"></script>
<script type="text/babel" src="src/screens/Friends.jsx"></script>
<script type="text/babel" src="src/screens/Friend.jsx"></script>
<script type="text/babel" src="src/screens/Settle.jsx"></script>
<script type="text/babel" src="src/screens/Activity.jsx"></script>
<script type="text/babel" src="src/screens/Profile.jsx"></script>
<script type="text/babel" src="src/screens/Invite.jsx"></script>
<script type="text/babel" src="src/screens/Join.jsx"></script>
<script type="text/babel" src="src/screens/Expense.jsx"></script>

<!-- Main App -->
<script type="text/babel" src="src/app.jsx"></script>

<!-- Mount -->
<script type="text/babel" data-presets="react">
  function Mount() {
    // Render the App INSIDE the iOS device frame.
    return (
      <window.IOSDevice width={402} height={874}>
        <window.App />
      </window.IOSDevice>
    );
  }
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<Mount />);
</script>
</body>
</html>
